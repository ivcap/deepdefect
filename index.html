<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DLTS Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        video { width: 100%; max-width: 400px; border: 3px solid #333; border-radius: 10px; background: #000; }
        #status { margin: 10px; color: #666; font-weight: bold; }
        #out { font-size: 1.5em; color: #007bff; margin-top: 15px; }
        button { padding: 15px 30px; font-size: 1.2em; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>DLTS Defect ID</h2>
    
    <button id="btn">POKRENI KAMERU</button>
    <div id="status">Sustav spreman.</div>
    
    <video id="vid" autoplay playsinline muted></video>
    <div id="out"></div>

    <script src="edge-impulse-standalone.js"></script>

    <script>
        const btn = document.getElementById('btn');
        const vid = document.getElementById('vid');
        const status = document.getElementById('status');
        const out = document.getElementById('out');

        btn.onclick = async () => {
            status.innerText = "Inicijalizacija...";
            btn.style.display = 'none';

            try {
                // 1. PALIMO KAMERU (kao što je radilo prije)
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                vid.srcObject = stream;
                status.innerText = "Kamera aktivna. Učitavam model...";

                // 2. ČEKAMO MODEL (pomoću Module objekta iz standalone.js)
                if (typeof Module === 'undefined') throw new Error("Standalone.js nije učitan!");
                
                // Čekamo da se WebAssembly inicijalizira
                Module.onRuntimeInitialized = () => {
                    Module.init();
                    status.innerText = "MODEL SPREMAN! Analiziram...";
                    pokreniAnalizu();
                };

                // Ako je već inicijaliziran
                if (classifierInitialized) {
                    Module.init();
                    status.innerText = "Sustav aktivan.";
                    pokreniAnalizu();
                }

            } catch (err) {
                status.innerText = "Greška: " + err.message;
                btn.style.display = 'block';
            }
        };

        let classifierInitialized = false;
        Module.onRuntimeInitialized = () => { classifierInitialized = true; };

        function pokreniAnalizu() {
            const canvas = document.createElement('canvas');
            canvas.width = 96; 
            canvas.height = 96;
            const ctx = canvas.getContext('2d');

            setInterval(() => {
                ctx.drawImage(vid, 0, 0, 96, 96);
                const data = ctx.getImageData(0, 0, 96, 96).data;
                let features = [];
                for (let i = 0; i < data.length; i += 4) {
                    features.push((data[i] << 16) | (data[i+1] << 8) | data[i+2]);
                }

                // Direktno pozivamo Module funkcije (bez klase)
                let typedArray = new Float32Array(features);
                let ptr = Module._malloc(typedArray.length * 4);
                Module.HEAPF32.set(typedArray, ptr >> 2);
                
                let ret = Module.run_classifier(ptr, features.length, false);
                Module._free(ptr);

                if (ret.result === 0) {
                    let ispis = "";
                    for (let i = 0; i < ret.size(); i++) {
                        let c = ret.get(i);
                        ispis += `<div>${c.label}: ${(c.value * 100).toFixed(1)}%</div>`;
                        c.delete();
                    }
                    out.innerHTML = ispis;
                }
                ret.delete();
            }, 500);
        }
    </script>
</body>
</html>
