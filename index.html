<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>DLTS Defect Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        #video-container { position: relative; display: inline-block; border: 4px solid #333; border-radius: 10px; overflow: hidden; background: #000; }
        video { display: block; width: 100%; max-width: 400px; height: auto; }
        #predictions { margin-top: 20px; font-weight: bold; font-size: 1.2em; color: #007bff; }
        #status { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>
    <h2>DLTS Defect ID (Si)</h2>
    <div id="status">Učitavam model...</div>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <div id="predictions">Rezultati će se pojaviti ovdje...</div>

    <script src="edge-impulse-standalone.js"></script>
    <script src="app.js"></script>
</body>
</html>
