<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <title>DLTS Defect ID - Pause Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f0f0; padding: 10px; margin: 0; }
        #container { position: relative; display: inline-block; width: 100%; max-width: 500px; border: 5px solid #333; border-radius: 15px; overflow: hidden; background: #000; line-height: 0; }
        video { width: 100%; height: auto; display: block; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .ui-box { margin: 15px 0; display: flex; justify-content: center; gap: 10px; }
        button { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: bold; }
        #start-btn { background: #007bff; }
        #pause-btn { background: #dc3545; display: none; } /* Skriven dok se ne pokrene kamera */
        #status { font-weight: bold; color: #444; margin-bottom: 10px; min-height: 1.2em; }
    </style>
</head>
<body>
    <h2>DLTS Defect ID</h2>
    
    <div id="status">Sustav spreman.</div>

    <div class="ui-box">
        <button id="start-btn">POKRENI KAMERU</button>
        <button id="pause-btn">PAUZA</button>
    </div>

    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>

    <script src="edge-impulse-standalone.js"></script>

    <script>
        class MyClassifier {
            init() {
                if (typeof Module === 'undefined') return Promise.reject("Model nije učitan!");
                Module.init();
                return Promise.resolve();
            }
            analyze(features) {
                let typedArray = new Float32Array(features);
                let ptr = Module._malloc(typedArray.length * 4);
                Module.HEAPF32.set(typedArray, ptr >> 2);
                let ret = Module.run_classifier(ptr, features.length, false);
                Module._free(ptr);
                
                let found = [];
                for (let i = 0; i < ret.size(); i++) {
                    let c = ret.get(i);
                    found.push({ label: c.label, val: c.value, x: c.x, y: c.y, w: c.width, h: c.height });
                    c.delete();
                }
                ret.delete();
                return found;
            }
        }

        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const ctx = overlay.getContext('2d');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');

        let isPaused = false;
        let aiInterval = null;

        startBtn.onclick = async () => {
            status.innerText = "Otvaram kameru...";
            startBtn.style.display = 'none';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;

                video.onloadedmetadata = () => {
                    overlay.width = video.videoWidth;
                    overlay.height = video.videoHeight;
                    pauseBtn.style.display = 'block'; // Prikaži gumb za pauzu
                    startAI();
                };
            } catch (err) {
                status.innerText = "Greška: " + err.message;
                startBtn.style.display = 'inline-block';
            }
        };

        // Logika za Pauzu
        pauseBtn.onclick = () => {
            if (!isPaused) {
                isPaused = true;
                video.pause(); // Zaustavi video frame
                pauseBtn.innerText = "NASTAVI";
                pauseBtn.style.background = "#28a745"; // Promijeni u zeleno
                status.innerText = "ZALEĐENO (Analiza pauzirana)";
            } else {
                isPaused = false;
                video.play(); // Pokreni video ponovo
                pauseBtn.innerText = "PAUZA";
                pauseBtn.style.background = "#dc3545"; // Vrati u crveno
                status.innerText = "DETEKCIJA AKTIVNA!";
            }
        };

        async function startAI() {
            status.innerText = "Učitavam model...";
            const ai = new MyClassifier();
            
            try {
                if (typeof Module === 'undefined' || !Module.init) {
                    await new Promise(r => setTimeout(r, 2000));
                }
                
                await ai.init();
                status.innerText = "DETEKCIJA AKTIVNA!";

                const tempC = document.createElement('canvas');
                tempC.width = 96; tempC.height = 96;
                const tempCtx = tempC.getContext('2d');

                aiInterval = setInterval(() => {
                    // Ako je pauzirano, ne radi ništa (ostavlja zadnji frame na ekranu)
                    if (isPaused) return;

                    tempCtx.drawImage(video, 0, 0, 96, 96);
                    const pixels = tempCtx.getImageData(0, 0, 96, 96).data;
                    let feats = [];
                    for (let i = 0; i < pixels.length; i += 4) {
                        feats.push((pixels[i] << 16) | (pixels[i+1] << 8) | pixels[i+2]);
                    }

                    const results = ai.analyze(feats);
                    
                    ctx.clearRect(0, 0, overlay.width, overlay.height);
                    results.forEach(r => {
                        if (r.val > 0.5) {
                            const sx = overlay.width / 96;
                            const sy = overlay.height / 96;
                            ctx.strokeStyle = "#00FF00";
                            ctx.lineWidth = 4;
                            ctx.strokeRect(r.x * sx, r.y * sy, r.w * sx, r.h * sy);
                            ctx.fillStyle = "#00FF00";
                            ctx.font = "bold 20px Arial";
                            ctx.fillText(`${r.label} ${(r.val*100).toFixed(0)}%`, r.x * sx, (r.y * sy) - 10);
                        }
                    });
                }, 200);
            } catch (e) {
                status.innerText = "Model nije spreman. Osvježi stranicu.";
            }
        }
    </script>
</body>
</html>
