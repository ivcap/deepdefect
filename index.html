<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="utf-8">
    <title>DLTS Defect Detector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 20px; }
        #video-container { position: relative; display: inline-block; border: 3px solid #333; border-radius: 10px; overflow: hidden; }
        video { display: block; width: 100%; max-width: 400px; height: auto; }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #results { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #007bff; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>DLTS Defect ID (Si)</h1>
    <p>Usmjeri kameru u graf (50-275K)</p>

    <div class="controls">
        <button id="start-camera">Pokreni Kameru</button>
    </div>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
    </div>

    <div id="results">Status: Čekam kameru...</div>

    <script src="edge-impulse-standalone.js"></script>
    <script src="run-impulse.js"></script>
</body>
</html>
